<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Собрать ланч - Del&F&Del</title>
		<link rel="stylesheet" href="styles.css" />
		<link rel="stylesheet" href="print.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto"
			rel="stylesheet"
		/>
	</head>
	<body>
		<header>
			<h1>Del&F&Del</h1>
			<nav>
				<a href="index.html">Главная</a>
				<a href="menu.html">Собрать ланч</a>
				<a href="index.html#about">О нас</a>
				<a href="index.html#footer">Контакты</a>
			</nav>
		</header>
		<main>
			<section>
				<div id="category-buttons">
					<!-- Кнопки категорий будут добавлены сюда динамически -->
				</div>
				<div id="dishes-container" class="dishes-container">
					<!-- Карточки блюд будут добавлены сюда динамически -->
				</div>
			</section>
		</main>
		<section class="forms-container">
			<div class="forms-wrapper">
				<!-- Колонка с выбранными блюдами -->
				<div id="selected-items-container" class="selected-items-column">
					<!-- Здесь будут отображаться выбранные блюда -->
				</div>
				<div class="form-block">
					<form
						action="https://httpbin.org/post"
						method="post"
						class="customer-form"
					>
						<h3>Ваши данные</h3>
						<label for="name">Имя:</label>
						<input type="text" id="name" name="name" required /><br /><br />

						<label for="email">Email:</label>
						<input type="email" id="email" name="email" required /><br /><br />

						<input type="checkbox" id="newsletter" name="newsletter" />
						<label for="newsletter"
							>Получать информацию о скидках и акциях</label
						><br /><br />

						<label for="phone">Номер телефона:</label>
						<input type="tel" id="phone" name="phone" required /><br /><br />

						<label for="address">Адрес доставки:</label>
						<input
							type="text"
							id="address"
							name="address"
							required
						/><br /><br />

						<label for="delivery-time">Время доставки:</label>
						<select id="delivery-time" name="delivery-time">
							<option value="asap">Как можно скорее</option>
							<option value="time">Ко времени</option></select
						><br /><br />

						<!-- Поле выбора времени всегда видно -->
						<label for="specific-time"
							>Выберите время (если выбрали "Ко времени"):</label
						>
						<select id="specific-time" name="specific-time">
							<option value="">Время доставки</option>
							<option value="12:00">12:00</option>
							<option value="12:30">12:30</option>
							<option value="13:00">13:00</option>
							<option value="13:30">13:30</option>
							<option value="14:00">14:00</option>
							<option value="14:30">14:30</option>
							<option value="15:00">15:00</option>
							<option value="15:30">15:30</option>
							<option value="16:00">16:00</option>
							<option value="16:30">16:30</option>
							<option value="17:00">17:00</option>
							<option value="17:30">17:30</option>
							<option value="18:00">18:00</option>
							<option value="18:30">18:30</option>
							<option value="19:00">19:00</option>
							<option value="19:30">19:30</option>
							<option value="20:00">20:00</option>
						</select>
						<br /><br />

						<input type="reset" value="Сбросить" />
						<input type="submit" value="Отправить" />
					</form>
				</div>
			</div>
		</section>
		<footer>
			<p>
				Контактные данные:
				<a href="mailto:del-f-del@lunchdelivery.ru"
					>del-f-del@lunchdelivery.ru</a
				>
			</p>
			<p>Телефон: <a href="tel:+79801234567">+7 (980) 123-45-67</a></p>
		</footer>

		<!-- Подключение скриптов -->
		<script type="module" src="menu-script.js"></script>
	</body>
</html>
