<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Оформить заказ - Del&F&Del</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="styles.css" />
		<link rel="stylesheet" href="print.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto"
			rel="stylesheet"
		/>
	</head>
	<body>
		<header class="container">
			<nav class="navbar navbar-expand-lg navbar-dark">
				<div class="container-fluid">
					<a class="navbar-brand fs-3" href="index.html">Del&F&Del</a>
					<button
						class="navbar-toggler"
						type="button"
						data-bs-toggle="collapse"
						data-bs-target="#navbarNav"
						aria-controls="navbarNav"
						aria-expanded="false"
						aria-label="Toggle navigation"
					>
						<span class="navbar-toggler-icon"></span>
					</button>
					<div class="collapse navbar-collapse" id="navbarNav">
						<ul class="navbar-nav ms-auto">
							<li class="nav-item">
								<a class="nav-link" href="menu.html">Собрать ланч</a>
							</li>
							<li class="nav-item">
								<a class="nav-link active" aria-current="page" href="order.html"
									>Оформить заказ</a
								>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="orders.html">Мои заказы</a>
							</li>
						</ul>
					</div>
				</div>
			</nav>
		</header>
		<main class="container">
			<section class="my-5">
				<h2 class="text-center">Состав заказа</h2>
				<div
					id="order-items-container"
					class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
				>
					<!-- Карточки выбранных блюд будут здесь -->
				</div>
			</section>
			<section class="my-5">
				<h3 class="text-center mb-5">Оформление заказа</h3>
				<div class="row g-5">
					<div class="col-lg-6">
						<div id="form-order-summary" class="card selected-items-column">
							<!-- Сюда будет вставляться состав заказа -->
						</div>
					</div>
					<div class="col-lg-6">
						<div class="card form-block">
							<div class="card-body">
								<form
									action="https://httpbin.org/post"
									method="post"
									class="customer-form"
								>
									<h3 class="card-title text-center">Ваши данные</h3>
									<div class="mb-3">
										<label for="name" class="form-label">Имя:</label>
										<input
											type="text"
											id="name"
											name="name"
											class="form-control"
											required
										/>
									</div>

									<div class="mb-3">
										<label for="email" class="form-label">Email:</label>
										<input
											type="email"
											id="email"
											name="email"
											class="form-control"
											required
										/>
									</div>

									<div class="form-check mb-3">
										<input
											type="checkbox"
											id="newsletter"
											name="newsletter"
											class="form-check-input"
										/>
										<label for="newsletter" class="form-check-label"
											>Получать информацию о скидках и акциях</label
										>
									</div>

									<div class="mb-3">
										<label for="phone" class="form-label"
											>Номер телефона:</label
										>
										<input
											type="tel"
											id="phone"
											name="phone"
											class="form-control"
											required
										/>
									</div>

									<div class="mb-3">
										<label for="address" class="form-label"
											>Адрес доставки:</label
										>
										<input
											type="text"
											id="address"
											name="address"
											class="form-control"
											required
										/>
									</div>

									<div class="mb-3">
										<label for="delivery-time" class="form-label"
											>Время доставки:</label
										>
										<select
											id="delivery-time"
											name="delivery-time"
											class="form-select"
										>
											<option value="asap">Как можно скорее</option>
											<option value="time">Ко времени</option>
										</select>
									</div>

									<div
										id="specific-time-container"
										class="mb-3"
										style="display: none"
									>
										<label for="specific-time" class="form-label"
											>Выберите время (если выбрали "Ко времени"):</label
										>
										<select
											id="specific-time"
											name="specific-time"
											class="form-select"
										>
											<option value="">Время доставки</option>
											<option value="12:00">12:00</option>
											<option value="12:30">12:30</option>
											<option value="13:00">13:00</option>
											<option value="13:30">13:30</option>
											<option value="14:00">14:00</option>
											<option value="14:30">14:30</option>
											<option value="15:00">15:00</option>
											<option value="15:30">15:30</option>
											<option value="16:00">16:00</option>
											<option value="16:30">16:30</option>
											<option value="17:00">17:00</option>
											<option value="17:30">17:30</option>
											<option value="18:00">18:00</option>
											<option value="18:30">18:30</option>
											<option value="19:00">19:00</option>
											<option value="19:30">19:30</option>
											<option value="20:00">20:00</option>
										</select>
									</div>
									<div id="form-error-message" class="form-error"></div>
									<button type="reset" class="btn btn-secondary">
										Сбросить
									</button>
									<button type="submit" class="btn btn-primary">
										Отправить
									</button>
								</form>
							</div>
						</div>
					</div>
				</div>
			</section>
		</main>
		<footer class="container text-center py-4">
			<p>
				Контактные данные:
				<a href="mailto:del-f-del@lunchdelivery.ru"
					>del-f-del@lunchdelivery.ru</a
				>
			</p>
			<p>Телефон: <a href="tel:+79801234567">+7 (980) 123-45-67</a></p>
		</footer>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"
		></script>
		<script type="module" src="order-script.js"></script>
	</body>
</html>
